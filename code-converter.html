<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聚宽代码转换器 — 王者Quant</title>
  <meta name="description" content="聚宽策略代码一键转换为PTrade/QMT格式，基于Pyodide运行真实Python转换引擎(V5.1)">
  <style>
    :root {
      --bg-primary: #0f1923; --bg-secondary: #1a2733; --bg-tertiary: #1e3044;
      --bg-input: #152230; --border: #2a3a4a; --text-primary: #dce4ec;
      --text-secondary: #8899aa; --text-muted: #5a6d7e; --accent: #c8a45c;
      --accent-hover: #d4b36d; --accent-glow: rgba(200,164,92,0.25);
      --blue: #4a90d9; --green: #27ae60; --green-glow: rgba(39,174,96,0.2);
      --red: #e74c3c; --orange: #e67e22;
      --font-mono: 'SF Mono','Cascadia Code','Fira Code','Consolas','Menlo',monospace;
      --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
      --radius: 8px; --radius-lg: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font-sans); background:var(--bg-primary); color:var(--text-primary); min-height:100vh; line-height:1.6; }

    .header { background:var(--bg-secondary); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    .header-brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text-primary); }
    .header-brand span { font-size:18px; font-weight:700; background:linear-gradient(135deg,var(--accent),#e8c97a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .header-nav { display:flex; gap:8px; align-items:center; }
    .header-nav a { color:var(--text-secondary); text-decoration:none; padding:6px 14px; border-radius:6px; font-size:14px; transition:0.2s; }
    .header-nav a:hover { color:var(--text-primary); background:rgba(255,255,255,0.04); }
    .header-nav a.active { color:var(--accent); background:rgba(200,164,92,0.08); }

    .engine-status { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); padding:4px 10px; border-radius:12px; border:1px solid var(--border); }
    .engine-status .dot { width:7px; height:7px; border-radius:50%; }
    .dot-loading { background:var(--orange); animation:pulse 1s infinite; }
    .dot-ready { background:var(--green); }
    .dot-error { background:var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .container { max-width:1500px; margin:0 auto; padding:20px 24px; }

    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:16px; }
    .toolbar-group { display:flex; align-items:center; gap:8px; padding:4px; background:var(--bg-secondary); border-radius:var(--radius); border:1px solid var(--border); }
    .toolbar-group label { font-size:13px; color:var(--text-secondary); padding:0 8px; white-space:nowrap; font-weight:500; }
    .platform-btn { padding:8px 16px; border:none; background:transparent; color:var(--text-secondary); border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; transition:0.2s; white-space:nowrap; }
    .platform-btn:hover { color:var(--text-primary); }
    .platform-btn.active { background:var(--accent); color:#1a1a1a; font-weight:600; box-shadow:0 2px 8px var(--accent-glow); }
    .btn { padding:8px 18px; border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary); border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:500; transition:0.2s; display:flex; align-items:center; gap:6px; white-space:nowrap; }
    .btn:hover:not(:disabled) { background:var(--bg-tertiary); border-color:#3a4a5a; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-primary { background:var(--accent); border-color:var(--accent); color:#1a1a1a; font-weight:600; }
    .btn-primary:hover:not(:disabled) { background:var(--accent-hover); box-shadow:0 4px 16px var(--accent-glow); }
    .btn-copy { background:var(--blue); border-color:var(--blue); color:#fff; }
    .btn-copy:hover:not(:disabled) { background:#5da0e5; }
    .toolbar-spacer { flex:1; }
    .badge { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:500; }
    .badge-success { background:var(--green-glow); color:var(--green); }
    .badge-warning { background:rgba(230,126,34,0.15); color:var(--orange); }
    .badge-error { background:rgba(231,76,60,0.15); color:var(--red); }

    .editor-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; min-height:520px; }
    @media (max-width:900px) { .editor-grid { grid-template-columns:1fr; } }
    .editor-panel { background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius-lg); display:flex; flex-direction:column; overflow:hidden; }
    .panel-header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-tertiary); }
    .panel-title { font-size:13px; font-weight:600; color:var(--text-secondary); display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:0.5px; }
    .panel-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
    .dot-input { background:var(--blue); }
    .dot-output { background:var(--green); }
    .panel-actions { display:flex; gap:4px; }
    .panel-btn { padding:4px 10px; border:1px solid transparent; background:transparent; color:var(--text-muted); border-radius:4px; cursor:pointer; font-size:12px; transition:0.2s; }
    .panel-btn:hover { color:var(--text-primary); background:rgba(255,255,255,0.04); }

    .editor-area { flex:1; position:relative; display:flex; }
    .line-numbers { padding:14px 0; background:rgba(0,0,0,0.2); color:var(--text-muted); font-family:var(--font-mono); font-size:13px; line-height:1.65; text-align:right; user-select:none; overflow:hidden; min-width:44px; border-right:1px solid rgba(255,255,255,0.04); }
    .line-numbers span { display:block; padding:0 10px; }
    textarea.editor { flex:1; background:var(--bg-input); color:var(--text-primary); border:none; padding:14px 16px; font-family:var(--font-mono); font-size:13px; line-height:1.65; resize:none; outline:none; tab-size:4; white-space:pre; overflow-wrap:normal; overflow-x:auto; }
    textarea.editor::placeholder { color:var(--text-muted); }
    textarea.editor:focus { background:#182838; }
    textarea.editor.output { background:#121e28; cursor:default; }
    textarea.editor.output.has-content { cursor:text; }

    /* Loading overlay on output */
    .output-loading { position:absolute; inset:0; background:rgba(15,25,35,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:5; }
    .output-loading.hidden { display:none; }
    .loading-spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-text { font-size:13px; color:var(--text-secondary); }

    .report-panel { margin-top:16px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; transition:all 0.3s; }
    .report-panel.collapsed .report-body { display:none; }
    .report-header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; cursor:pointer; user-select:none; }
    .report-header:hover { background:rgba(255,255,255,0.01); }
    .report-title { font-size:13px; font-weight:600; color:var(--text-secondary); display:flex; align-items:center; gap:8px; }
    .report-body { padding:0 16px 14px; max-height:300px; overflow-y:auto; }
    .report-section { margin-top:8px; }
    .report-section-title { font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
    .report-item { display:flex; align-items:flex-start; gap:8px; padding:3px 0; font-size:12px; font-family:var(--font-mono); color:var(--text-secondary); }
    .report-item .tag { font-size:10px; padding:1px 6px; border-radius:3px; white-space:nowrap; font-weight:500; flex-shrink:0; }
    .tag-mapping { background:rgba(74,144,217,0.2); color:#5da0e5; }
    .tag-warning { background:rgba(230,126,34,0.2); color:#e67e22; }
    .tag-error { background:rgba(231,76,60,0.2); color:#e74c3c; }
    .tag-change { background:rgba(39,174,96,0.2); color:#27ae60; }
    .report-empty { text-align:center; color:var(--text-muted); padding:20px; font-size:13px; }

    .footer { text-align:center; padding:20px; color:var(--text-muted); font-size:12px; border-top:1px solid var(--border); margin-top:32px; }

    .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:10px 24px; border-radius:8px; font-size:14px; font-weight:500; z-index:999; opacity:0; transition:opacity 0.3s; pointer-events:none; }
    .toast.show { opacity:1; }
    .toast.error { background:var(--red); }

    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:#3a4a5a; }
  </style>
</head>
<body>

<div class="header">
  <a class="header-brand" href="index.html"><span>⚡ 王者Quant</span></a>
  <div class="header-nav">
    <div class="engine-status" id="engineStatus">
      <span class="dot dot-loading" id="engineDot"></span>
      <span id="engineLabel">Python 引擎待加载</span>
    </div>
    <a href="index.html">首页</a>
    <a href="code-converter.html" class="active">代码转换器</a>
  </div>
</div>

<div class="container">
  <div class="toolbar">
    <div class="toolbar-group">
      <label>目标平台:</label>
      <button class="platform-btn active" data-target="ptrade" onclick="setTarget('ptrade')">📊 PTrade</button>
      <button class="platform-btn" data-target="qmt" onclick="setTarget('qmt')">📈 QMT / EasyXT</button>
    </div>
    <button class="btn" onclick="loadSample()">📋 加载示例</button>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-primary" id="btnConvert" onclick="convert()">🔄 开始转换</button>
    <button class="btn btn-copy" id="btnCopy" onclick="copyOutput()">📋 复制结果</button>
    <button class="btn" id="btnDownload" onclick="downloadOutput()">💾 下载 .py</button>
  </div>

  <div class="editor-grid">
    <!-- 输入 -->
    <div class="editor-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="panel-dot dot-input"></span> 聚宽代码 (JoinQuant)</div>
        <div class="panel-actions">
          <button class="panel-btn" onclick="clearInput()">清空</button>
        </div>
      </div>
      <div class="editor-area">
        <div class="line-numbers" id="inputLineNumbers"></div>
        <textarea class="editor" id="inputEditor"
          placeholder="在此粘贴聚宽策略代码...
支持: initialize / handle_data 框架策略
支持: run_daily / run_weekly / run_monthly 定时任务
支持: get_price / get_current_data / history / query 等常用API"></textarea>
      </div>
    </div>

    <!-- 输出 -->
    <div class="editor-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="panel-dot dot-output"></span> <span id="outputLabel">PTrade 代码</span></div>
        <div class="panel-actions">
          <span id="lineCount" style="font-size:11px;color:var(--text-muted);margin-right:8px;"></span>
        </div>
      </div>
      <div class="editor-area" style="position:relative;">
        <div class="line-numbers" id="outputLineNumbers"></div>
        <textarea class="editor output" id="outputEditor" readonly
          placeholder="转换结果将显示在这里..."></textarea>
        <div class="output-loading hidden" id="outputLoading">
          <div class="loading-spinner"></div>
          <div class="loading-text" id="loadingText">Python 引擎加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 转换报告 -->
  <div class="report-panel" id="reportPanel">
    <div class="report-header" onclick="toggleReport()">
      <div class="report-title">
        📊 转换报告
        <span id="reportSummary" style="font-size:12px;color:var(--text-muted);"></span>
      </div>
      <span style="color:var(--text-muted);font-size:12px;" id="reportToggle">展开 ▼</span>
    </div>
    <div class="report-body" id="reportBody">
      <div class="report-empty">点击"开始转换"查看详细变更报告（由 Python V5.1 转换器生成）</div>
    </div>
  </div>

  <div class="footer">
    Copyright © 2024 王者Quant · 基于 <a href="https://pyodide.org" target="_blank" style="color:var(--accent);">Pyodide</a> 在浏览器中运行 Python V5.1 转换器 · 代码不上传服务器
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  Pyodide 驱动的聚宽 → PTrade/QMT 转换器
//  引擎: code_converter/converters/jq_to_ptrade_unified_v3.py (V5.1)
//        code_converter/converters/jq_to_easyxt.py (V1.0)
// ============================================================

let currentTarget = 'ptrade';
let pyodide = null;
let pyodideLoading = false;
let pyodideReady = false;
let modulesReady = { ptrade: false, qmt: false };
let lastReport = null;

// ==================== Pyodide 初始化 ====================

function updateEngineStatus(state, label) {
  const dot = document.getElementById('engineDot');
  const text = document.getElementById('engineLabel');
  dot.className = 'dot';
  switch(state) {
    case 'loading': dot.classList.add('dot-loading'); break;
    case 'ready': dot.classList.add('dot-ready'); break;
    case 'error': dot.classList.add('dot-error'); break;
  }
  text.textContent = label;
}

async function initPyodide() {
  if (pyodideReady) return true;
  if (pyodideLoading) {
    // 等待已有加载完成
    while (pyodideLoading && !pyodideReady) {
      await new Promise(r => setTimeout(r, 100));
    }
    return pyodideReady;
  }

  pyodideLoading = true;
  updateEngineStatus('loading', 'Python 引擎加载中...');
  showLoading(true, '正在下载 Python 运行时 (~10MB)...');

  try {
    // 加载 Pyodide CDN
    if (typeof loadPyodide === 'undefined') {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('Pyodide CDN 加载失败'));
        document.head.appendChild(script);
      });
    }

    updateLoadingText('初始化 Python 解释器...');
    pyodide = await loadPyodide({
      indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/'
    });

    // 加载 Python 转换器文件
    updateLoadingText('加载 PTrade 转换器 (V5.1)...');
    const [ptradeCode, easyxtCode, tushareCode] = await Promise.all([
      fetch('py_converter/jq_to_ptrade_unified_v3.py').then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}: jq_to_ptrade_unified_v3.py`);
        return r.text();
      }),
      fetch('py_converter/jq_to_easyxt.py').then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}: jq_to_easyxt.py`);
        return r.text();
      }),
      fetch('py_converter/tushare_data_functions.py').then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}: tushare_data_functions.py`);
        return r.text();
      })
    ]);

    // 写入 Pyodide 虚拟文件系统
    pyodide.FS.writeFile('/home/pyodide/tushare_data_functions.py', tushareCode);
    pyodide.FS.writeFile('/home/pyodide/jq_to_ptrade_unified_v3.py', ptradeCode);
    pyodide.FS.writeFile('/home/pyodide/jq_to_easyxt.py', easyxtCode);

    // 导入模块
    updateLoadingText('导入 PTrade 转换器模块...');
    await pyodide.runPythonAsync('import jq_to_ptrade_unified_v3');
    modulesReady.ptrade = true;

    updateLoadingText('导入 QMT 转换器模块...');
    await pyodide.runPythonAsync('import jq_to_easyxt');
    modulesReady.qmt = true;

    pyodideReady = true;
    pyodideLoading = false;
    showLoading(false);
    updateEngineStatus('ready', 'Python 引擎就绪 ✅');
    return true;

  } catch (err) {
    pyodideLoading = false;
    showLoading(false);
    updateEngineStatus('error', `引擎加载失败: ${err.message}`);
    showToast(`❌ ${err.message}`, true);
    console.error('Pyodide init error:', err);
    return false;
  }
}

// ==================== 转换逻辑 ====================

async function convert() {
  const input = document.getElementById('inputEditor').value.trim();
  if (!input) {
    showToast('⚠ 请先粘贴聚宽代码');
    return;
  }

  // 确保 Pyodide 就绪
  if (!pyodideReady) {
    const ok = await initPyodide();
    if (!ok) return;
  }

  // 检查目标模块是否加载
  if (currentTarget === 'ptrade' && !modulesReady.ptrade) {
    showToast('⚠ PTrade 转换器模块未加载');
    return;
  }
  if (currentTarget === 'qmt' && !modulesReady.qmt) {
    showToast('⚠ QMT 转换器模块未加载');
    return;
  }

  // 禁用按钮，显示加载
  setButtonsDisabled(true);
  showLoading(true, '转换中...');

  try {
    // 把用户输入写入虚拟 FS（避免转义问题）
    pyodide.FS.writeFile('/home/pyodide/_input.py', input);

    let pythonCode;
    if (currentTarget === 'ptrade') {
      pythonCode = `
import json
import jq_to_ptrade_unified_v3

with open('/home/pyodide/_input.py', 'r', encoding='utf-8') as f:
    jq_code = f.read()

converter = jq_to_ptrade_unified_v3.JQToPtradeUnifiedConverter(verbose=False)
try:
    result = converter.convert(jq_code)
    report = converter.get_conversion_report()
    print(json.dumps({'success': True, 'code': result, 'report': report}, ensure_ascii=False))
except Exception as e:
    import traceback
    print(json.dumps({'success': False, 'error': str(e), 'traceback': traceback.format_exc()}, ensure_ascii=False))
`;
    } else {
      // QMT / EasyXT
      pythonCode = `
import json
import jq_to_easyxt

with open('/home/pyodide/_input.py', 'r', encoding='utf-8') as f:
    jq_code = f.read()

converter = jq_to_easyxt.JQToEasyXTConverter(verbose=False)
try:
    result = converter.convert(jq_code)
    report = converter.conversion_report
    # 转换 report 中的 set 为 list
    for key in report:
        if isinstance(report[key], set):
            report[key] = list(report[key])
    print(json.dumps({'success': True, 'code': result, 'report': report}, ensure_ascii=False, default=str))
except Exception as e:
    import traceback
    print(json.dumps({'success': False, 'error': str(e), 'traceback': traceback.format_exc()}, ensure_ascii=False))
`;
    }

    // 捕获 stdout
    let stdout = '';
    pyodide.setStdout({ batched: (text) => { stdout += text + '\n'; } });

    await pyodide.runPythonAsync(pythonCode);

    // 解析结果
    const output = stdout.trim();
    if (!output) {
      throw new Error('Python 转换器没有返回结果');
    }

    const data = JSON.parse(output);

    if (data.success) {
      document.getElementById('outputEditor').value = data.code;
      document.getElementById('outputEditor').classList.add('has-content');
      updateLineNumbers();
      updateReport(data.report);
      showToast(`✅ 转换完成 (${data.code.split('\\n').length} 行)`);
    } else {
      document.getElementById('outputEditor').value = `# ❌ 转换失败\n# ${data.error}\n${data.traceback || ''}`;
      document.getElementById('outputEditor').classList.add('has-content');
      updateLineNumbers();
      updateReport({errors: [data.error]});
      showToast(`❌ 转换失败: ${data.error}`, true);
    }

  } catch (err) {
    console.error('Conversion error:', err);
    document.getElementById('outputEditor').value = `# ❌ 运行时错误\n# ${err.message}`;
    document.getElementById('outputEditor').classList.add('has-content');
    updateLineNumbers();
    showToast(`❌ ${err.message}`, true);
  } finally {
    setButtonsDisabled(false);
    showLoading(false);
  }
}

// ==================== 报告渲染 ====================

function updateReport(report) {
  const body = document.getElementById('reportBody');
  const summary = document.getElementById('reportSummary');
  lastReport = report;

  if (!report) {
    body.innerHTML = '<div class="report-empty">✅ 转换完成，无特殊报告</div>';
    summary.textContent = '';
    return;
  }

  const parts = [];
  let totalItems = 0;

  // API mappings
  const apiMappings = report.api_mappings || [];
  if (apiMappings.length > 0) {
    parts.push('<div class="report-section-title">🔗 API 映射 (' + apiMappings.length + ')</div>');
    parts.push(apiMappings.map(m => `<div class="report-item"><span class="tag tag-mapping">映射</span><span>${escapeHtml(String(m))}</span></div>`).join(''));
    totalItems += apiMappings.length;
  }

  // Changes
  const changes = report.changes || [];
  if (changes.length > 0) {
    parts.push('<div class="report-section-title">✏️ 代码变更 (' + changes.length + ')</div>');
    parts.push(changes.map(c => `<div class="report-item"><span class="tag tag-change">变更</span><span>${escapeHtml(String(c))}</span></div>`).join(''));
    totalItems += changes.length;
  }

  // Added functions
  const addedFns = report.added_functions || [];
  if (addedFns.length > 0) {
    parts.push('<div class="report-section-title">📦 注入的辅助函数 (' + addedFns.length + ')</div>');
    parts.push(addedFns.map(f => `<div class="report-item"><span class="tag tag-change">注入</span><span>${escapeHtml(String(f))}</span></div>`).join(''));
    totalItems += addedFns.length;
  }

  // Warnings
  const warnings = report.warnings || [];
  if (warnings.length > 0) {
    parts.push('<div class="report-section-title">⚠️ 警告 (' + warnings.length + ')</div>');
    parts.push(warnings.map(w => `<div class="report-item"><span class="tag tag-warning">警告</span><span>${escapeHtml(String(w))}</span></div>`).join(''));
    totalItems += warnings.length;
  }

  // Errors
  const errors = report.errors || [];
  if (errors.length > 0) {
    parts.push('<div class="report-section-title">❌ 错误 (' + errors.length + ')</div>');
    parts.push(errors.map(e => `<div class="report-item"><span class="tag tag-error">错误</span><span>${escapeHtml(String(e))}</span></div>`).join(''));
    totalItems += errors.length;
  }

  if (parts.length === 0) {
    body.innerHTML = '<div class="report-empty">✅ 转换完成，无特殊报告</div>';
    summary.textContent = '';
  } else {
    body.innerHTML = parts.join('');
    summary.textContent = `${totalItems} 项`;
  }
}

function loadSample() {
  const sample = `# 克隆自聚宽文章：https://www.joinquant.com/post/19619
# 标题：【策略】夏普超过2.0，后市靠定增一步步往上爬

import jqdata
import pandas as pd
import numpy as np
from math import log as lg

MY_EXCLUDE_STOCKS = ["600656.XSHG","000594.XSHE"]

def initialize(context):
    set_option("avoid_future_data", True)
    set_option('use_real_price', True)
    set_order_cost(OrderCost(open_tax=0, close_tax=0.001,
        open_commission=0.0003, close_commission=0.0003), type='stock')

    g.s1 = '000001.XSHG'
    g.small_cap_num = 50
    g.stop_index_drop = -0.03
    g.win_length = 126
    g.rel_return = -0.5
    g.max_weight = 0.3

    run_daily(rebalance, time='14:21')

def before_trading_start(context):
    fundamental_df = get_fundamentals(
        query(valuation.code)
        .order_by(valuation.market_cap.asc())
        .limit(g.small_cap_num)
    )
    g.stocks = np.array([i[0] for i in fundamental_df.values])
    g.stocks = remove_st(g.stocks)

def remove_st(stocks):
    result = []
    for s in stocks:
        if (not get_current_data()[s].is_st) and (s not in MY_EXCLUDE_STOCKS):
            result.append(s)
    return np.array(result)

def trade_log(stock, weight):
    log.info("[ %s(%s) -> %.2f ]" % (stock_name(stock), stock, weight))

def stock_name(stock):
    return get_security_info(stock).display_name

def rebalance(context):
    bar_dict = get_current_data()

    for stock in context.portfolio.positions.keys():
        if stock not in g.stocks:
            order_target_value(stock, 0)
            trade_log(stock, 0)

    index_hist = attribute_history(g.s1, 2, "1d", "close")
    index_return_1d = lg(index_hist['close'][1] / index_hist['close'][0])
    if index_return_1d < g.stop_index_drop:
        for stock in g.stocks:
            order_target_value(stock, 0)
            trade_log(stock, 0)
        return

    set_universe(g.stocks.tolist() + [g.s1])
    stock_hist = history(g.win_length, "1d", "close")
    stock_return = (stock_hist.iloc[g.win_length-1] - stock_hist.iloc[0]) / stock_hist.iloc[0]
    index_return = stock_return[g.s1]
    rel_return = stock_return - index_return

    g.stocks = [stock for stock in g.stocks
        if not bar_dict[stock].paused
        and get_bars(stock, 1, '1m', 'volume', include_now=True)['volume'] != 0
        and bar_dict[stock].day_open < 1.095 * stock_hist[stock].iloc[-1]
        and bar_dict[stock].day_open > 0.905 * stock_hist[stock].iloc[-1]
        and rel_return[stock] < abs(index_return) * g.rel_return]

    if len(g.stocks) == 0:
        return

    weight = {}
    sum_weight = 0
    for stock in g.stocks:
        weight[stock] = abs((rel_return[stock] - abs(index_return) * g.rel_return) / index_return) * g.max_weight
        if weight[stock] > g.max_weight:
            weight[stock] = g.max_weight
        sum_weight += weight[stock]

    for stock in g.stocks:
        weight[stock] /= sum_weight
        if weight[stock] > g.max_weight:
            weight[stock] = g.max_weight
        trade_log(stock, weight[stock])
        value = context.portfolio.total_value * weight[stock]
        order_target_value(stock, value)
`;

  document.getElementById('inputEditor').value = sample;
  updateLineNumbers();
  showToast('📋 已加载示例策略代码（聚宽官方社区策略）');
}

function clearInput() {
  document.getElementById('inputEditor').value = '';
  document.getElementById('outputEditor').value = '';
  document.getElementById('outputEditor').classList.remove('has-content');
  updateLineNumbers();
  document.getElementById('reportBody').innerHTML = '<div class="report-empty">点击"开始转换"查看详细变更报告（由 Python V5.1 转换器生成）</div>';
  document.getElementById('reportSummary').textContent = '';
}

function copyOutput() {
  const output = document.getElementById('outputEditor').value;
  if (!output) { showToast('⚠ 没有可复制的内容'); return; }
  navigator.clipboard.writeText(output).then(
    () => showToast('📋 已复制到剪贴板!'),
    () => { document.getElementById('outputEditor').select(); document.execCommand('copy'); showToast('📋 已复制到剪贴板!'); }
  );
}

function downloadOutput() {
  const output = document.getElementById('outputEditor').value;
  if (!output) { showToast('⚠ 没有可下载的内容'); return; }
  const ext = currentTarget === 'ptrade' ? 'ptrade' : 'qmt';
  const blob = new Blob([output], { type: 'text/x-python' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `converted_strategy.${ext}.py`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 文件已下载');
}

function toggleReport() {
  const panel = document.getElementById('reportPanel');
  panel.classList.toggle('collapsed');
  document.getElementById('reportToggle').textContent =
    panel.classList.contains('collapsed') ? '展开 ▶' : '收起 ▲';
}

function updateLineNumbers() {
  updatePanelLines('inputEditor', 'inputLineNumbers');
  updatePanelLines('outputEditor', 'outputLineNumbers');
  const outputLines = document.getElementById('outputEditor').value.split('\n').length;
  const val = document.getElementById('outputEditor').value.trim();
  document.getElementById('lineCount').textContent = val ? `${outputLines} 行` : '';
}

function updatePanelLines(editorId, lineNumId) {
  const editor = document.getElementById(editorId);
  const lineNum = document.getElementById(lineNumId);
  const lines = editor.value.split('\n');
  const count = Math.max(lines.length, 20);
  let html = '';
  for (let i = 1; i <= count; i++) html += `<span>${i}</span>`;
  lineNum.innerHTML = html;
  editor.onscroll = () => { lineNum.scrollTop = editor.scrollTop; };
}

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' error' : '');
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 初始化 ====================

document.addEventListener('DOMContentLoaded', () => {
  updateLineNumbers();
  updateOutputLabel();

  document.getElementById('inputEditor').addEventListener('input', () => {
    updatePanelLines('inputEditor', 'inputLineNumbers');
  });

  // Ctrl+Enter 快捷键
  document.getElementById('inputEditor').addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      convert();
    }
  });

  // 后台预加载 Pyodide（不阻塞 UI）
  setTimeout(() => {
    if (!pyodideReady && !pyodideLoading) {
      initPyodide().catch(err => console.warn('Pyodide 预加载失败:', err));
    }
  }, 1500);
});
