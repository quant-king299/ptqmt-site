# 站点：ptqmt.com 静态站点优化示例
server {
    listen 80;
    server_name ptqmt.com www.ptqmt.com;
    return 301 https://ptqmt.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ptqmt.com www.ptqmt.com;

    # SSL 证书路径（请替换为你的实际路径）
    ssl_certificate     /www/server/panel/vhost/cert/ptqmt.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ptqmt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/wwwroot/ptqmt.com;  # 替换为你的站点根目录
    index index.html;

    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML 较短缓存（避免强制 no-cache）
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Gzip 压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 如果已编译 brotli 模块可开启（可选，BT默认可能未启用）
    #brotli on;
    #brotli_comp_level 5;
    #brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全与性能
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # 单页与 docsify 路由支持（hash 路由通常不需要，但保留兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 访问日志（可按需关闭）
    access_log /www/wwwlogs/ptqmt.com.log;
    error_log  /www/wwwlogs/ptqmt.com.error.log;
}