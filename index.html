<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>王者Quant量化交易文档</title>
  <meta name="keywords" content="量化交易, QMT, PTrade, Python, 金融, 策略, 回测">
  <meta name="description" content="专业的量化交易学习平台，涵盖QMT和PTrade两大主流量化交易平台">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- 预加载 -->
  <link rel="preload" href="vendor/docsify/docsify.min.js" as="script">

  <!-- 样式 -->
  <link rel="stylesheet" href="themes/vue.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/prismjs/themes/prism-custom.css">
</head>
<body>
  <div id="app">正在加载...</div>

  <script>
    window.$docsify = {
      name: '王者Quant',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: true,
      maxLevel: 4,
      subMaxLevel: 2,

      // 搜索配置
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '找不到相关内容',
        depth: 6,
        namespace: 'quant-docs'
      },

      // 复制代码
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      },

      // 404
      notFoundPage: { '/': '_404.md' },

      externalLinkTarget: '_blank',
      externalLinkRel: 'noopener',
      routerMode: 'hash',

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md',
        '/ptrade-api': '/docs/Chapter-21.md',
        '/ptrade': '/docs/Chapter-21.md',
        '/qmt-api': '/docs/Chapter-17.md',
        '/intro': '/README.md',
        '/home': '/README.md'
      },

      plugins: [
        // 章节导航
        function(hook) {
          hook.doneEach(function() {
            var sidebar = document.querySelector('.sidebar');
            var container = document.querySelector('.markdown-section');
            if (!sidebar || !container) return;

            // 构建扁平链接列表
            var links = [];
            var seen = {};
            sidebar.querySelectorAll('a[href^="#/"]').forEach(function(a) {
              var href = a.getAttribute('href') || '';
              var path = href.split('?')[0].split('#')[0].replace(/^#\//, '').replace(/\/+$/, '');
              if (!path || seen[path]) return;
              seen[path] = true;
              links.push({ href: href, path: path, title: (a.textContent || '').trim() });
            });

            // 找当前页
            var curr = location.hash.replace(/^#\//, '').split('?')[0].split('#')[0].replace(/\/+$/, '');
            var idx = links.findIndex(function(x) { return x.path === curr; });
            if (idx === -1) return;

            // 移除旧导航
            var old = container.querySelector('.page-nav');
            if (old) old.remove();
            var oldSep = container.querySelector('.page-nav-sep');
            if (oldSep) oldSep.remove();

            var prev = idx > 0 ? links[idx - 1] : null;
            var next = idx < links.length - 1 ? links[idx + 1] : null;
            if (!prev && !next) return;

            var sep = document.createElement('hr');
            sep.className = 'page-nav-sep';
            container.appendChild(sep);

            var nav = document.createElement('div');
            nav.className = 'page-nav';

            function makeLink(item, label) {
              var a = document.createElement('a');
              a.href = item.href;
              a.rel = label;
              var title = item.title || item.path.split('/').pop();
              a.innerHTML = '<span class="label">' + label + '</span><span class="title">' + title + '</span>';
              return a;
            }

            if (prev) nav.appendChild(makeLink(prev, '上一章'));
            else nav.appendChild(Object.assign(document.createElement('span'), { textContent: '已是第一章', className: 'page-nav-empty' }));

            if (next) nav.appendChild(makeLink(next, '下一章'));
            else nav.appendChild(Object.assign(document.createElement('span'), { textContent: '已是最后一章', className: 'page-nav-empty' }));

            container.appendChild(nav);
          });
        }
      ]
    };
  </script>

  <!-- Docsify 核心 -->
  <script src="vendor/docsify/docsify.min.js"></script>

  <!-- Prism 语言支持 -->
  <script src="vendor/prismjs/prism-core.min.js"></script>
  <script src="vendor/docsify/plugins/search.min.js"></script>
  <script src="vendor/docsify/plugins/prism-python.min.js"></script>
  <script src="vendor/docsify/plugins/prism-bash.min.js"></script>
  <script src="vendor/docsify/plugins/prism-javascript.min.js"></script>
  <script src="vendor/docsify/plugins/prism-json.min.js"></script>
  <script src="vendor/docsify/plugins/prism-sql.min.js"></script>
  <script src="vendor/docsify/plugins/copy-code.min.js"></script>

  <!-- 移动端侧边栏 -->
  <script src="mobile-sidebar.js"></script>
  <script src="navbar-enhancement.js"></script>
  <script src="search-config.js"></script>
  <script src="anchor-navigation-fix.js"></script>
</body>
</html>
