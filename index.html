<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>王者Quant量化交易文档</title>
  <meta name="keywords" content="量化交易, QMT, PTrade, Python, 金融, 策略, 回测">
  <meta name="description" content="专业的量化交易学习平台，涵盖QMT和PTrade两大主流量化交易平台">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- docsify-themeable 基础主题（专业排版/间距/响应式） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <!-- Prism Tomorrow Night 代码高亮主题（本地） -->
  <link rel="stylesheet" href="vendor/prismjs/themes/prism-tomorrow.css">

  <!-- 自定义样式（覆盖默认主题） -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">正在加载...</div>

  <script>
    window.$docsify = {
      name: '王者Quant',
      nameLink: '#/',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: true,
      maxLevel: 4,
      subMaxLevel: 3,
      auto2top: true,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '没有找到相关内容',
        depth: 6,
        namespace: 'quant-docs'
      },

      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      },

      notFoundPage: { '/': '_404.md' },
      externalLinkTarget: '_blank',
      externalLinkRel: 'noopener',
      routerMode: 'hash',

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md',
        '/ptrade-api': '/docs/Chapter-21.md',
        '/ptrade': '/docs/Chapter-21.md',
        '/qmt-api': '/docs/Chapter-17.md',
        '/intro': '/README.md',
        '/home': '/README.md'
      },

      plugins: [
        // 章节上下翻页
        function(hook) {
          hook.doneEach(function() {
            var sidebar = document.querySelector('.sidebar');
            var container = document.querySelector('.markdown-section');
            if (!sidebar || !container) return;

            var links = [];
            var seen = {};
            sidebar.querySelectorAll('a[href^="#/"]').forEach(function(a) {
              var href = a.getAttribute('href') || '';
              var path = href.split('?')[0].split('#')[0].replace(/^#\//, '').replace(/\/+$/, '');
              if (!path || seen[path]) return;
              seen[path] = true;
              links.push({ href: href, path: path, title: (a.textContent || '').trim() });
            });

            var curr = location.hash.replace(/^#\//, '').split('?')[0].split('#')[0].replace(/\/+$/, '');
            var idx = links.findIndex(function(x) { return x.path === curr; });
            if (idx === -1) return;

            var old = container.querySelector('.page-nav-wrap');
            if (old) old.remove();

            var prev = idx > 0 ? links[idx - 1] : null;
            var next = idx < links.length - 1 ? links[idx + 1] : null;
            if (!prev && !next) return;

            var wrap = document.createElement('div');
            wrap.className = 'page-nav-wrap';
            var nav = document.createElement('div');
            nav.className = 'page-nav';

            function makeLink(item, label) {
              var a = document.createElement('a');
              a.href = item.href;
              a.innerHTML = '<span class="page-nav-arrow">' + (label === '上一章' ? '←' : '→') + '</span><span class="page-nav-text"><span class="page-nav-label">' + label + '</span><span class="page-nav-title">' + (item.title || '') + '</span></span>';
              return a;
            }

            if (prev) nav.appendChild(makeLink(prev, '上一章'));
            var spacer = document.createElement('div');
            spacer.className = 'page-nav-spacer';
            nav.appendChild(spacer);
            if (next) nav.appendChild(makeLink(next, '下一章'));

            wrap.appendChild(nav);
            container.appendChild(wrap);
          });
        }
      ]
    };
  </script>

  <!-- docsify-themeable JS -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0"></script>

  <!-- Docsify 核心（内置 Prism，不要单独加载 prism-core） -->
  <script src="vendor/docsify/docsify.min.js"></script>

  <!-- 插件 -->
  <script src="vendor/docsify/plugins/search.min.js"></script>
  <script src="vendor/docsify/plugins/copy-code.min.js"></script>
  <script src="vendor/docsify/plugins/zoom-image.min.js"></script>

  <!-- Prism 语言扩展（Docsify 内置 Prism 后加载语言定义） -->
  <script src="vendor/docsify/plugins/prism-python.min.js"></script>
  <script src="vendor/docsify/plugins/prism-bash.min.js"></script>
  <script src="vendor/docsify/plugins/prism-javascript.min.js"></script>
  <script src="vendor/docsify/plugins/prism-json.min.js"></script>
  <script src="vendor/docsify/plugins/prism-sql.min.js"></script>

  <!-- 移动端侧边栏 -->
  <script src="mobile-sidebar.js"></script>
  <script src="search-config.js"></script>
  <script src="anchor-navigation-fix.js"></script>
</body>
</html>
