      },

      },

      },

      externalLinkRel: 'noopener',

        '/ptrade-%E5%AE%8C%E6%95%B4api%E5%8F%82%E8%80%83%E6%89%8B%E5%86%8C': '/docs/Chapter-21.md',

      // 插件配置
      plugins: [
        // 返回顶部功能
        function(hook, vm) {
          hook.doneEach(function() {
            const backToTop = document.getElementById('backToTop');
            
            window.addEventListener('scroll', function() {
              if (window.pageYOffset > 300) {
                backToTop.classList.add('show');
              } else {
                backToTop.classList.remove('show');
              }
            });
            
            backToTop.addEventListener('click', function() {

                behavior: 'smooth'
              });

        // 章节导航按钮功能
        function(hook, vm) {
          hook.doneEach(function() {
            // 构建扁平化的侧边栏链接数组
            function buildFlatSidebarLinks() {
              var sidebar = document.querySelector('.sidebar');
              if (!sidebar) return [];
              
              var links = Array.from(sidebar.querySelectorAll('a[href^="#/"]'));
              // 按页面路径去重，保持出现顺序
              var seen = new Set();
              var out = [];
              
              links.forEach(function(a) {
                var href = a.getAttribute('href') || '';
                var n = normRoute(href);
                var pathOnly = n.split('?')[0].split('#')[0]; // 仅路径部分
                if (!pathOnly || seen.has(pathOnly)) return;
                seen.add(pathOnly);
                out.push({
                  href: href,          // 原始 href（用于点击）
                  norm: n,             // 规范化（含可能的子锚）
                  pathOnly: pathOnly,  // 仅路径部分（用于分页计算）
                  el: a,
                  title: (a.textContent || '').trim()
                });
              });
              
              return out;
            }
            
            // 规范化路由路径
            function normRoute(s) {
              return (s || '')
                .replace(/^#\//, '')
                .replace(/\.\//g, '')
                .split('?')[0]
                .replace(/\/+$/, '')
                .replace(/\/{2,}/g, '/');
            }
            
            // 查找前一章和后一章
            function findNeighbors(flatLinks, currentHash) {
              var curr = normRoute(currentHash);
              // 当前页仅路径部分（忽略 query/hash）
              var currPath = curr.split('?')[0].split('#')[0];
              var idx = flatLinks.findIndex(function(x) { return x.pathOnly === currPath; });
              if (idx === -1) return {prev: null, next: null};
              var prev = idx > 0 ? flatLinks[idx-1] : null;
              var next = idx < flatLinks.length-1 ? flatLinks[idx+1] : null;
              return {prev: prev, next: next};
            }
            
            // 创建导航链接
            function makeLink(item, cls, fallbackText) {
              var a = document.createElement('a');
              a.className = cls;
              a.setAttribute('rel', cls === 'prev' ? 'prev' : 'next');
              a.href = item.href;
              // 兜底标题：若侧栏文本为空，取路径最后一段
              var title = (item.title || '').trim();
              if (!title) {
                try {
                  var path = (item.norm || '').split('/').filter(Boolean);
                  title = path.length ? decodeURIComponent(path[path.length-1]) : fallbackText;
                } catch(e) { title = fallbackText; }
              }
              a.innerHTML = '<span class="label">' + (cls === 'prev' ? '上一章' : '下一章') + '</span>'
                          + '<span class="title">' + title + '</span>';
              return a;
            }
            
            // 渲染分页导航
            function renderPagination(prev, next) {
              var container = document.querySelector('.markdown-section');
              if (!container) return;
              
              // 移除旧分页
              var old = container.querySelector('.page-nav');
              if (old) old.remove();
              var oldSep = container.querySelector('.page-nav-sep');
              if (oldSep) oldSep.remove();
              
              // 分隔线提高可见性
              var sep = document.createElement('hr');
              sep.className = 'page-nav-sep';
              container.appendChild(sep);
              
              // 构建新分页
              var nav = document.createElement('div');
              nav.className = 'page-nav';
              
              if (prev) nav.appendChild(makeLink(prev, 'prev', '上一章'));
              else {
                var span = document.createElement('span');
                span.style.opacity = '0.6';
                span.textContent = '无上一章';
                nav.appendChild(span);
              }
              
              if (next) nav.appendChild(makeLink(next, 'next', '下一章'));
              else {
                var span2 = document.createElement('span');
                span2.style.opacity = '0.6';
                span2.textContent = '无下一章';
                nav.appendChild(span2);
              }
              
              container.appendChild(nav);
            }
            
            // 获取当前页面的前一章和后一章并渲染导航按钮
            var flatLinks = buildFlatSidebarLinks();
            var neighbors = findNeighbors(flatLinks, location.hash);
            renderPagination(neighbors.prev, neighbors.next);
          });
        }
      ]
    };
  </script>

  <!-- 在所有Prism组件加载完成后初始化 -->
  <script>
    // 等待所有Prism组件加载完成后初始化
    window.addEventListener('load', function() {

          Prism.highlightAll();

    });
    
    // 添加一个更强大的高亮函数
    function highlightCodeBlocks() {
      if (typeof Prism !== 'undefined') {
        // 获取所有代码块
        var codeBlocks = document.querySelectorAll('pre code');
        codeBlocks.forEach(function(block) {
          // 确保每个代码块都有正确的语言类
          var classes = block.className.split(' ');
          var hasLanguageClass = classes.some(function(cls) {
            return cls.startsWith('language-');
          });
          
          if (!hasLanguageClass && block.parentElement) {
            // 如果没有语言类，尝试从父元素获取
            var preClasses = block.parentElement.className.split(' ');
            var preLanguageClass = preClasses.find(function(cls) {
              return cls.startsWith('language-');
            });
            
            if (preLanguageClass) {
              block.className += ' ' + preLanguageClass;
            }
          }
          
          // 高亮代码块
          Prism.highlightElement(block);
        });
        console.log('Code blocks highlighted:', codeBlocks.length);
      }
    }
    
    // 在页面加载完成后执行高亮
    document.addEventListener('DOMContentLoaded', highlightCodeBlocks);
    window.addEventListener('load', highlightCodeBlocks);
    
    // 在每次页面内容更新后执行高亮（适用于SPA应用）
    if (typeof MutationObserver !== 'undefined') {
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.type === 'childList') {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) { // Element node
                if (node.querySelectorAll) {
                  var codeBlocks = node.querySelectorAll('pre code');
                  if (codeBlocks.length > 0 || node.matches('pre code')) {
                    setTimeout(highlightCodeBlocks, 0);
                  }
                }
              }
            });
          }
        });
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }
  </script>

  <!-- 强制清理重复搜索框脚本 -->
  <script>
    // 强制清理重复搜索框
    function forceCleanupSearchBoxes() {
      // 查找所有搜索相关的元素
      const searchContainers = Array.from(document.querySelectorAll('.search, .docsify-search'));
      const searchInputs = Array.from(document.querySelectorAll('input[type="search"]'));
      
      console.log('找到搜索容器:', searchContainers.length);
      console.log('找到搜索输入框:', searchInputs.length);
      
      // 只保留第一个搜索容器
      if (searchContainers.length > 1) {
        for (let i = 1; i < searchContainers.length; i++) {
          if (searchContainers[i] && searchContainers[i].parentNode) {
            searchContainers[i].parentNode.removeChild(searchContainers[i]);
          }
        }
      }
      
      // 只保留第一个搜索输入框
      if (searchInputs.length > 1) {
        for (let i = 1; i < searchInputs.length; i++) {
          if (searchInputs[i] && searchInputs[i].parentNode) {
            searchInputs[i].parentNode.removeChild(searchInputs[i]);
          }
        }
      }
      
      // 特别处理：确保侧边栏中只有一个搜索容器
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) {
        const sidebarSearchContainers = Array.from(sidebar.querySelectorAll('.search'));
        if (sidebarSearchContainers.length > 1) {
          for (let i = 1; i < sidebarSearchContainers.length; i++) {
            if (sidebarSearchContainers[i] && sidebarSearchContainers[i].parentNode) {
              sidebarSearchContainers[i].parentNode.removeChild(sidebarSearchContainers[i]);
            }
          }
        }
      }
    }
    
    // 在不同时间点执行清理
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(forceCleanupSearchBoxes, 500);
      setTimeout(forceCleanupSearchBoxes, 1500);
    });
    
    window.addEventListener('load', function() {
      setTimeout(forceCleanupSearchBoxes, 1000);
      setTimeout(forceCleanupSearchBoxes, 3000);
    });
    
    window.addEventListener('hashchange', function() {
      setTimeout(forceCleanupSearchBoxes, 300);
    });
  </script>
